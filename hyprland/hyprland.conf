
monitor = DP-1, 1920x1080@144, 0x0, 1
monitor = eDP-1, 1920x1080@165, 0x1080, 1

#input.
input {
    kb_layout = br
    kb_variant = abnt2
}

#binds.
$mod = SUPER

##apps.
bind = $mod, T, exec, ghostty
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, forcekillactive
bind = $mod, E, exec, nautilus

##floating.
bind = $mod, C, togglefloating,

##launcher.
bind = $mod, R, exec, noctalia msg panel-toggle launcher

##move windows.
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

##window focus.
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

## screenshot.
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -

## workspaces.
bind = $mod, LEFT, workspace, -1
bind = $mod, RIGHT, workspace, +1
bind = $mod SHIFT, LEFT, movetoworkspace, -1
bind = $mod SHIFT, RIGHT, movetoworkspace, +1

##special workspace.
bind = $mod, M, movetoworkspacesilent, special
bind = $mod SHIFT, M, togglespecialworkspace,

##power menu.
bind = $mod, X, exec, noctalia msg panel-toggle session

##clipboard. 
bind = $mod, V, exec, noctalia msg panel-toggle clipboard

##notifications.
bind = $mod, N, exec, noctalia msg panel-toggle notifications

##control center.
bind = $mod SHIFT, N, exec, noctalia msg panel-toggle control-center

##window resizing.
binde = $mod CONTROL, l, resizeactive, 20 0
binde = $mod CONTROL, h, resizeactive, -20 0
binde = $mod CONTROL, k, resizeactive, 0 -20
binde = $mod CONTROL, j, resizeactive, 0 20

#window switcher.
bind = ALT, Tab, exec, noctalia msg window-switcher

## brightness & volume (repetitive shortcuts).
bindel = , XF86AudioRaiseVolume, exec, noctalia msg volume-up
bindel = , XF86AudioLowerVolume, exec, noctalia msg volume-down
bindel = , XF86AudioMute, exec, noctalia msg volume-up

bindel = , XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindel = , XF86MonBrightnessDown, exec, noctalia msg brightness-down

# animations.
animations {
    enabled = true
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothIn, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 4, easeOutExpo, popin 85%
    animation = windowsOut, 1, 4, easeInOutCubic, popin 85%
    animation = windowsMove, 1, 4, easeOutExpo
    animation = border, 1, 8, default
    animation = borderangle, 1, 30, default, loop
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 5, overshot, slide
    animation = specialWorkspace, 1, 4, overshot, slidevert
}

# general.
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ffffffee) rgba(888888aa) 45deg
    col.inactive_border = rgba(1a1a1aaa)
    layout = dwindle
    resize_on_border = true
}

# decoration.
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.75
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000088)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.25
    }
}

# dwindle layout.
dwindle {
    preserve_split = true
    smart_resizing = true
}

