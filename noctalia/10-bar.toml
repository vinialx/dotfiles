[bar.default]
position = "top"
layer = "top"
reserve_space = true

thickness = 40
margin_edge = 10
margin_ends = 90
padding = 7
widget_spacing = 8

background_opacity = 0.90
radius = 14
shadow = true
contact_shadow = true
hover_highlight = true

font_weight = 500

capsule = true
capsule_fill = "surface_variant"
capsule_opacity = 0.54
capsule_thickness = 0.72
capsule_padding = 7
capsule_radius = 12

start = ["nix", "workspaces", "media"]

center = ["clock"]

end = [
  "active_window",
  "group:sysinfo",
  "group:connectivity",
  "privacy",
  "wallpaper",
  "notifications",
  "session",
]

[[bar.default.capsule_group]]
id = "sysinfo"
members = ["memory", "cpu", "battery"]
fill = "surface_variant"
foreground = "on_surface"
opacity = 0.65
padding = 9
widget_spacing = 9
radius = 12
accordion = true
accordion_direction = "start"

[[bar.default.capsule_group]]
id = "connectivity"
members = ["volume", "network", "bluetooth"]
fill = "surface_variant"
foreground = "on_surface"
opacity = 0.65
padding = 12
widget_spacing = 10
radius = 12
accordion = true
accordion_direction = "start"

[[bar.default.capsule_group]]
id = "wallpapers"
members = ["wallpaper", "wallhaven"]
fill = "surface_variant"
foreground = "on_surface"
opacity = 0.65
padding = 12
widget_spacing = 20
radius = 10
accordion = true
accordion_direction = "start"
