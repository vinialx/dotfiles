"$schema" = "https://starship.rs/config-schema.json"

palette = "vinialx"

add_newline = true

scan_timeout = 30
command_timeout = 500

format = """
[╭─](fg:overlay0)\
[](fg:noctalia_primary)\
$username\
[](fg:noctalia_primary bg:surface0)\
$directory\
[](fg:surface0 bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface2)\
$c\
$cpp\
$golang\
$rust\
$nodejs\
$bun\
$java\
$nim\
[](fg:surface2 bg:mantle)\
$docker_context\
[](fg:mantle)\
$cmd_duration\
$nix_shell\
$direnv\
$hostname\
$line_break\
[╰─](fg:overlay0)\
$character
"""

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](lavender)"

[username]
show_always = true
style_user = "bg:noctalia_primary fg:noctalia_on_primary bold"
style_root = "bg:red fg:crust bold"
format = "[  ]($style)"

[directory]
style = "bg:surface0 fg:text"
format = "[ 󰉋  $path ]($style)"
truncation_length = 3
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "bg:surface0 fg:red"

[git_branch]
symbol = " "
style = "bg:surface1 fg:subtext1"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:surface1 fg:yellow"
format = "[$all_status$ahead_behind ]($style)"
conflicted = " "
ahead = " ${count} "
behind = " ${count} "
diverged = "󰹹  ${ahead_count}  ${behind_count} "
untracked = "?${count} "
stashed = "󰏗 ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "󰆴 ${count} "

[nodejs]
symbol = " "
style = "bg:surface2 fg:green"
format = "[ $symbol$version ]($style)"

[bun]
symbol = " "
style = "bg:surface2 fg:yellow"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "bg:surface2 fg:sky"
format = "[ $symbol$version ]($style)"

[rust]
symbol = " "
style = "bg:surface2 fg:peach"
format = "[ $symbol$version ]($style)"

[c]
symbol = " "
style = "bg:surface2 fg:blue"
format = "[ $symbol$version ]($style)"

[cpp]
symbol = " "
style = "bg:surface2 fg:blue"
format = "[ $symbol$version ]($style)"

[java]
symbol = " "
style = "bg:surface2 fg:red"
format = "[ $symbol$version ]($style)"

[nim]
symbol = "󰆥 "
style = "bg:surface2 fg:yellow"
format = "[ $symbol$version ]($style)"

[docker_context]
symbol = " "
style = "bg:mantle fg:subtext1"
format = "[ $symbol$context ]($style)"

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:subtext0"
format = " [󱎫 $duration]($style)"

[nix_shell]
symbol = " "
style = "fg:blue"
format = " [$symbol$state( \\($name\\))]($style)"

[direnv]
disabled = false
symbol = " "
style = "fg:subtext0"
format = " [$symbol]($style)"

[hostname]
ssh_only = true
ssh_symbol = " "
style = "fg:red"
format = " [$ssh_symbol$hostname]($style)"

[jobs]
disabled = true
symbol = " "
number_threshold = 1
symbol_threshold = 1
style = "fg:subtext0"
format = " [$symbol$number]($style)"

[status]
disabled = true
symbol = " "
success_symbol = ""
style = "fg:red"
format = " [$symbol$status]($style)"

[time]
disabled = true
time_format = "%H:%M"
style = "bg:surface0 fg:text"
format = "[  $time ]($style)"

[palettes.vinialx]

noctalia_primary = "#9bcaff"
noctalia_on_primary = "#003256"

rosewater = "#d8dee9"
flamingo = "#d08770"
pink = "#b48ead"
mauve = "#b39ddb"
red = "#bf616a"
maroon = "#b86b77"
peach = "#d08770"
yellow = "#ebcb8b"
green = "#a3be8c"
teal = "#88c0d0"
sky = "#8fbcbb"
sapphire = "#81a1c1"

blue = "#9aa7c7"
lavender = "#b7b7d9"

text = "#d8dee9"
subtext1 = "#c5cbd6"
subtext0 = "#aeb6c4"

overlay2 = "#7f8796"
overlay1 = "#6e7380"
overlay0 = "#5d626d"

surface2 = "#3a3a46"
surface1 = "#30303a"
surface0 = "#26262f"

base = "#1b1b22"
mantle = "#17171d"
crust = "#121217"

cyan = "#88c0d0"
magenta = "#b39ddb"
white = "#d8dee9"
black = "#121217"
