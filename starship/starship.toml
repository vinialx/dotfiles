"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"


add_newline = true

format = """
[](lavender)\
$username\
[](fg:lavender bg:surface1)\
$directory\
[](fg:surface1 bg:blue)\
$git_branch\
$git_status\
[](fg:blue bg:mauve)\
$c\
$cpp\
$golang\
$rust\
$nodejs\
$bun\
$java\
$nim\
[](fg:mauve bg:surface2)\
$docker_context\
[](fg:surface2 bg:surface0)\
$time\
[](fg:surface0)\
$line_break\
$character
"""

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](lavender)"

[username]
show_always = true
style_user = "bg:lavender fg:base bold"
style_root = "bg:red fg:base bold"
format = "[  $user ]($style)"

[directory]
style = "bg:surface1 fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:blue fg:base"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:blue fg:base"
format = "[$all_status$ahead_behind ]($style)"

[nodejs]
symbol = " "
style = "bg:mauve fg:base"
format = "[ $symbol$version ]($style)"

[bun]
symbol = " "
style = "bg:mauve fg:base"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "bg:mauve fg:base"
format = "[ $symbol$version ]($style)"

[rust]
symbol = " "
style = "bg:mauve fg:base"
format = "[ $symbol$version ]($style)"

[c]
symbol = " "
style = "bg:mauve fg:base"
format = "[ $symbol$version ]($style)"

[cpp]
symbol = " "
style = "bg:mauve fg:base"
format = "[ $symbol$version ]($style)"

[java]
symbol = " "
style = "bg:mauve fg:base"
format = "[ $symbol$version ]($style)"

[nim]
symbol = "󰆥 "
style = "bg:mauve fg:base"
format = "[ $symbol$version ]($style)"

[docker_context]
symbol = " "
style = "bg:surface2 fg:text"
format = "[ $symbol$context ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:surface0 fg:text"
format = "[  $time ]($style)"

