# Change prefix.
unbind r
bind r source-file ~/.tmux.conf
set -g prefix C-s

# Style
gray="#3B4252"
gray_light="#D8DEE9"

# Status position.
set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${gray_light}, bg=default"
set -g status-left "#[fg=${gray_light}] #S #[fg=${gray_light}, nobold]  "
set -g status-right " #{cpu}  #{mem}"

set -g window-status-current-format "#[fg={${gray_light}, bold]  #[underscore] #I:#W"
set -g window-status-format "#I:#W"

set -g message-style "fg=${gray_light}, bg=default"

# Plugin list.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-mode-indicator'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# TPM start.
run '~/.tmux/plugins/tpm/tpm'
