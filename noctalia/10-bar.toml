[bar.default]
position = "top"
layer = "top"
reserve_space = true

thickness = 40
margin_edge = 10
margin_ends = 220
padding = 7
widget_spacing = 8

background_opacity = 0.84
radius = 20
shadow = true
contact_shadow = true
hover_highlight = true

font_weight = 500

capsule = true
capsule_fill = "surface_container"
capsule_opacity = 0.68
capsule_thickness = 0.72
capsule_padding = 7

start = ["nix", "workspaces", "media"]

center = ["clock"]

end = [
  "cpu",
  "group:sysinfo",
  "keyboard_layout",
  "group:connectivity",
  "privacy",
  "wallpaper",
  "notifications",
  "session",
]

[[bar.default.capsule_group]]
id = "sysinfo"
members = ["memory", "battery"]
fill = "primary_container"
foreground = "on_primary_container"
opacity = 0.58
padding = 9
widget_spacing = 9
accordion = true
accordion_direction = "start"

[[bar.default.capsule_group]]
id = "connectivity"
members = ["volume", "network", "bluetooth"]
fill = "secondary_container"
foreground = "on_secondary_container"
opacity = 0.56
padding = 12
widget_spacing = 10
accordion = true
accordion_direction = "start"
