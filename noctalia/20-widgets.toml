[widget.clock]
format = "{:%a, %d %b}  •  {:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"
font_weight = 400
font_scale = 1.12
capsule_fill = "primary_container"
capsule_foreground = "on_primary_container"
capsule_opacity = 0.94
capsule_padding = 14

[widget.workspaces]
style = "regular"
label_source = "id"
show_labels = true
labels_only_when_occupied = false
hide_when_empty = false
max_label_chars = 2
scale = 1.2
active_pill_size = 2
inactive_pill_size = 1.0
focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_container"
urgent_color = "error"
focused_output_only = false

[widget.memory]
type = "sysmon"
stat = "ram_used"
visualization = "none"
show_value = true
show_glyph = true
highlight_color = "tertiary"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "gauge"
show_value = true
show_glyph = true
label_min_width = 38
highlight_color = "error"
capsule_fill = "tertiary_container"
capsule_foreground = "on_tertiary_container"
capsule_opacity = 0.86
capsule_padding = 10

[widget.media]
min_length = 200
max_length = 250
art_size = 25
artist_first = true
hide_album_art = false
hide_when_no_media = true
title_scroll = "always"
capsule_fill = "secondary_container"
capsule_foreground = "on_secondary_container"
capsule_opacity = 0.82
capsule_padding = 10

[widget.launcher]
scale = 1.15
capsule_fill = "primary"
capsule_foreground = "on_primary"
capsule_opacity = 0.90
capsule_padding = 10

[widget.notifications]
scale = 1.08
icon_color = "primary"

[widget.bluetooth]
enabled = true
show_label = true

[widget.network]
show_label = false

[widget.wallpaper]
glyph = "photo"
scale = 1.08
icon_color = "tertiary"

[widget.session]
glyph = "shutdown"
scale = 1.08
icon_color = "error"

[widget.privacy]
type = "privacy"
hide_inactive = true
icon_spacing = 6
active_color = "primary"
capsule = true
capsule_fill = "primary_container"
capsule_foreground = "on_primary_container"
capsule_opacity = 0.78
capsule_padding = 8

[widget.media-zone]
type = "spacer"
length = 42
interactive = true
capsule = false

[widget.media-zone.actions]
left = "media toggle"
middle = "media next"
right = "media previous"
scroll_left = "media previous"
scroll_right = "media next"
back = "media previous"
forward = "media next"

[widget.nix]
type = "custom_button"
label = "󱄅"
glyph = ""
scale = 2.1
capsule = true
capsule_fill = "primary_container"
capsule_foreground = "on_primary_container"
capsule_opacity = 0.88
capsule_padding = 8

[widget.nix.actions]
left = "exec ghostty -e zsh -ic nxcfg"
middle = "exec ghostty -e zsh -ic nxclrd"
right = "exec ghostty -e zsh -ic nxupd"
scroll_up = "wallpaper-previous"
scroll_down = "wallpaper-next"

[widget.keyboard_layout]
hide_when_single_layout = false
show_glyph = true
show_label = true
display = "short"
color = "secondary"
