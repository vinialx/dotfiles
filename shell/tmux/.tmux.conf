#prefix.
unbind r
bind r source-file ~/.tmux.conf
set -g prefix C-s

#keybinds.

##move windows.
bind -n M-H previous-window
bind -n M-L next-window

##manage sessions.
unbind C
bind C command-prompt -p "New session:" "new-session -s '%%'"
bind c new-window

##panel split.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##panel focus.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

##panel resize.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##selection and copy mode.
set -g status-keys vi
set -g mode-keys vi
set-window-option -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind -T copy-mode-vi C-v send -X rectangle-toggle


#style.
base="#1b1b22"
mantle="#17171d"
crust="#121217"

surface0="#23232b"
surface1="#2d2d36"
surface2="#383842"

text="#d8dee9"
subtext="#aeb6c4"
overlay="#666b75"

blue="#9aa7c7"
lavender="#b7b7d9"
green="#a3be8c"
yellow="#ebcb8b"
red="#bf616a"

#dynamic accent from Noctalia.
source-file -q ~/.config/tmux/noctalia-colors.conf


#general.
set -g mouse on
set -g base-index 1
set -g escape-time 0
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000


#theming.
set -g status on
set -g status-interval 2
set -g status-position top
set -g status-justify left

#neutral background.
set -g status-style "fg=${text},bg=${base}"

set -g status-left-length 100
set -g status-right-length 120


#session.
set -g status-left \
"#[fg=#{E:NOCTALIA_PRIMARY},bg=${base}]\
#[fg=#{E:NOCTALIA_ON_PRIMARY},bg=#{E:NOCTALIA_PRIMARY},bold]   #S \
#[fg=#{E:NOCTALIA_PRIMARY},bg=${base}]  "


#windows.
set -g window-status-separator " "

#inactive windows.
set -g window-status-format \
"#[fg=${subtext},bg=${base}] #I:#W "

#active window.
set -g window-status-current-format \
"#[fg=#{E:NOCTALIA_PRIMARY},bg=${base}]\
#[fg=#{E:NOCTALIA_ON_PRIMARY},bg=#{E:NOCTALIA_PRIMARY},bold]   #I:#W \
#[fg=#{E:NOCTALIA_PRIMARY},bg=${base}]"


#window activity.
set -g window-status-activity-style "fg=${yellow},bg=${base},bold"
set -g window-status-bell-style "fg=${red},bg=${base},bold"


#panes.
set -g pane-border-style "fg=${surface1}"
set -g pane-active-border-style "fg=${blue}"


#messages.
set -g message-style "fg=${text},bg=${surface0},bold"
set -g message-command-style "fg=${lavender},bg=${surface0},bold"


#copy mode.
set -g mode-style "fg=${crust},bg=${lavender},bold"


#plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'christoomey/vim-tmux-navigator'


#tmux plugin manager.
run '~/.tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'


#status right.
set -g status-right \
"#[fg=${overlay},bg=${base}]  \
#[fg=${subtext},bg=${base}]  \
#[fg=${text},bg=${base},bold]#{b:pane_current_path} "
