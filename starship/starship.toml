"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
[](#FFFFFF)\
$os\
$username\
[](bg:#808080 fg:#FFFFFF)\
$directory\
[](fg:#808080 bg:#C084FC)\
$git_branch\
$git_status\
[](fg:#C084FC bg:#D946EF)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#D946EF bg:#E5E7EB)\
$docker_context\
[](fg:#E5E7EB bg:#000000)\
$time\
[ ](fg:#000000)\
"""

[username]
show_always = true
style_user = "bg:#FFFFFF fg:#000000"
style_root = "bg:#FFFFFF fg:#000000"
format = '[ $user ]($style)'
disabled = false

[os]
style = "bg:#FFFFFF"
disabled = true 

[directory]
style = "bg:#808080 fg:#FFFFFF"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#E5E7EB fg:#000000"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#C084FC fg:#FFFFFF"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#C084FC fg:#FFFFFF"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#D946EF fg:#FFFFFF"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#000000 fg:#ffffff"
format = '[ $time ]($style)'

