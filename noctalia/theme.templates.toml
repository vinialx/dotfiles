[theme.templates]
enable_builtin_templates = true
enable_community_templates = true

builtin_ids = ["gtk3", "gtk4", "qt"]

community_ids = [
  "neovim",
  "obsidian",
  "opencode",
  "libreoffice",
  "fastfetch",
  "obs",
]

[theme.templates.user.superfile]
input_path = "/home/vinicius/dotfiles/noctalia/templates/superfile.toml"
output_path = "$XDG_CONFIG_HOME/superfile/theme/noctalia.toml"

[theme.templates.user.tmux]
input_path = "/home/vinicius/dotfiles/noctalia/templates/tmux-colors.conf"
output_path = "$XDG_CONFIG_HOME/tmux/noctalia-colors.conf"

[theme.templates.user.custom_starship]
input_path = "/home/vinicius/dotfiles/shell/starship/starship.template.toml"
output_path = "/home/vinicius/dotfiles/shell/starship/starship.toml"
