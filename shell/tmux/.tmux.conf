#prefix.
unbind r
bind r source-file ~/.tmux.conf
set -g prefix C-s

#keybinds.

##move windows.
bind -n M-H previous-window
bind -n M-L next-window

##manage sessions.
unbind C
bind C command-prompt -p "New session:" "new-session -s '%%'"
bind c new-window

##panel split.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##panel focus.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

##panel resize.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##selection and copy mode.
set -g status-keys vi
set -g mode-keys vi
set-window-option -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind -T copy-mode-vi C-v send -X rectangle-toggle

#style.
gray="#3B4252"
gray_light="#D8DEE9"
background="#2E3440"

#general.
set -g mouse on
set -g base-index 1
set -g escape-time 0
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000

#theming.
set -g status on
set -g status-interval 2
set -g status-position top
set -g status-justify left
set -g status-style "fg=${gray_light},bg=default"

set -g status-left-length 100
set -g status-left "#[fg=${gray_light}] #S #[fg=${gray_light},nobold]  "

set -g status-right-length 100

set -g window-status-current-format "#[fg=${gray_light},bold]  #[underscore] #I:#W"
set -g window-status-format "#I:#W"

#panes.
set -g pane-border-style "fg=${gray}"
set -g pane-active-border-style "fg=${gray_light}"

#messages.
set -g message-style "fg=${gray_light},bg=${background},bold"

#plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'christoomey/vim-tmux-navigator'

#tmux plugin manager.
run '~/.tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'

#status right override.
set -g status-right ""
set -g status-right \
"#[fg=${gray_light},bg=default]\
#[fg=${background},bg=${gray_light},bold]   #{b:pane_current_path} "
