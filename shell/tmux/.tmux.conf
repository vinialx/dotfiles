#prefix.
unbind r
bind r source-file ~/.tmux.conf
set -g prefix C-s

#style.
gray="#3B4252"
gray_light="#D8DEE9"
background="#2E3440"

#general.
set -g mouse on
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000

#theming.
set -g status on
set -g status-interval 2
set -g status-position top
set -g status-justify left
set -g status-style "fg=${gray_light},bg=default"

set -g status-left-length 100
set -g status-left "#[fg=${gray_light}] #S #[fg=${gray_light},nobold]  "

set -g status-right-length 100

set -g window-status-current-format "#[fg=${gray_light},bold]  #[underscore] #I:#W"
set -g window-status-format "#I:#W"

#panes.
set -g pane-border-style "fg=${gray}"
set -g pane-active-border-style "fg=${gray_light}"

#messages.
set -g message-style "fg=${gray_light},bg=${background},bold"

#plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'christoomey/vim-tmux-navigator'

#tmux plugin manager.
run '~/.tmux/plugins/tpm/tpm'

#status right override.
set -g status-right ""
set -g status-right \
"#[fg=${gray_light},bg=default]\
#[fg=${background},bg=${gray_light},bold]   #{b:pane_current_path} "
